name: release
on:
  push:
    tags:
      - 'v*'
  # Manual runs must be dispatched on a tag ref, goreleaser refuses untagged commits.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test before release
        run: go test ./... -race
      # SHA-pinned: this job holds contents: write, so a moving tag on a third-party
      # action is a supply-chain risk. Dependabot updates the SHA pin. (# v7.2.2)
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped write deploy key for tphakala/homebrew-tap; GoReleaser's brews
          # step pushes the regenerated formula over SSH with it (no PAT needed).
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
